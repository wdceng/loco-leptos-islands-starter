# Loco configuration file documentation
#
# This is the production environment. It differs from development in one
# deliberate way: anything that is a secret or an address takes no default.
# `get_env(name="X")` with no `default` fails at startup if `X` is unset, which
# is what you want — a production app that silently falls back to a development
# secret or a localhost database is worse than one that refuses to boot.
#
# The variables this file requires (set in the systemd unit, see
# DEPLOYMENT.md): JWT_SECRET, MAILER_HOST, MAILER_USER, MAILER_PASSWORD.
# Addresses have defaults; the unit overrides BINDING and PORT so the app
# listens on loopback behind the reverse proxy.

# Application logging configuration
logger:
  # Enable or disable logging.
  enable: true
  # Enable pretty backtrace (sets RUST_BACKTRACE=1). Off in production: it
  # costs performance and puts source paths into your logs.
  pretty_backtrace: false
  # Log level, options: trace, debug, info, warn or error.
  level: <%= get_env(name="LOG_LEVEL", default="info") %>
  # Define the logging format. options: compact, pretty or json
  # `json` is the machine-readable one, for a log aggregator.
  format: json
  # By default the logger has filtering only logs that came from your code or logs that came from `loco` framework. to see all third party libraries
  # Uncomment the line below to override to see all third party libraries you can enable this config and override the logger filters.
  # override_filter: trace

# Web server configuration
server:
  # Port on which the server will listen. the server binding is 0.0.0.0:{PORT}
  port: <%= get_env(name="PORT", default="5150") %>
  # Binding for the server (which interface to bind to).
  # `0.0.0.0`, not `localhost`: inside a container or a VM, a server bound to
  # loopback is unreachable from outside it.
  binding: <%= get_env(name="BINDING", default="0.0.0.0") %>
  # Public origin of the live site, used for links in outgoing mail. Not a
  # secret, so it has a default; HOST overrides it at start.
  host: <%= get_env(name="HOST", default="https://example.com") %>
  # Value of the `X-Powered-By` response header. Empty removes the header:
  # no reason to advertise the stack.
  ident: ""
  # Out of the box middleware configuration. to disable middleware you can changed the `enable` field to `false` of comment the middleware block
  middlewares:
    # The reference deployment (DEPLOYMENT.md) is Cloudflare in front of
    # Caddy: Cloudflare overwrites CF-Connecting-IP at the edge and Caddy
    # passes it through unchanged; X-Forwarded-For here would be Cloudflare's
    # own address. The rate limiter keys on the same source, and refuses to
    # boot a deployed environment keyed on the peer. Without any proxy use
    # ConnectInfo. Requests that reach the origin directly, bypassing the
    # CDN, could forge the header; hardening that is a Caddy trusted_proxies
    # change.
    remote_ip:
      enable: true
      source: CfConnectingIp
    # Cancels a request that has not produced response headers in time and
    # answers 408, so a hung handler cannot hold a connection open forever.
    # Milliseconds. Sized to the slowest legitimate path (a mail send) with
    # margin, far below a CDN's origin limit (Cloudflare: 100 s).
    timeout_request:
      enable: true
      timeout: 15000
    # Loco's github preset (HSTS, nosniff, X-Frame-Options, ...) plus what it
    # lacks. Only added to responses that do not already carry the header:
    # pages set their own nonce-based CSP (settings.security below), so the
    # preset CSP is the fallback for assets, robots.txt and the 404/429 pages.
    secure_headers:
      enable: true
      preset: github
      overrides:
        # Matches frame-ancestors 'none' in the CSP; preset says sameorigin.
        X-Frame-Options: DENY
        Referrer-Policy: strict-origin-when-cross-origin
        Permissions-Policy: camera=(), microphone=(), geolocation=()
        Cross-Origin-Opener-Policy: same-origin
        # Cross-origin isolation: our files load only on our own pages, and
        # our pages load nothing cross-origin. An embed from another domain
        # (map, video, payment widget) would need that resource to opt in,
        # or COEP dropped.
        Cross-Origin-Resource-Policy: same-origin
        Cross-Origin-Embedder-Policy: require-corp
        # Preload-ready HSTS (one year, subdomains, consent). Replaces the
        # preset's bare max-age. If the domain is behind a CDN, the zone's
        # HSTS setting must carry the same three parts; the submission at
        # hstspreload.org is done once for the apex domain, after go-live.
        # Every subdomain must be https from then on.
        Strict-Transport-Security: max-age=31536000; includeSubDomains; preload
    # Loco's built-in welcome page for unmatched routes. Off: unmatched routes
    # get a plain 404 until we render our own not-found page.
    fallback:
      enable: false
    # Serves the cargo-leptos output (islands bundle, stylesheet, copies of
    # public/) for any URL no controller claims. `uri: "/"` makes it the
    # router's fallback, so controller routes always win.
    static:
      enable: true
      # A production build without its bundle is a broken deploy: refuse to boot.
      must_exist: true
      # On the server the cargo-leptos output (`target/site` locally) is
      # deployed as a plain `site/` folder next to the binary.
      folder:
        uri: "/"
        path: "site"
      fallback: "site/404.html"
      # One year, never revalidated. Safe because release builds hash the
      # bundle and stylesheet names (src/assets.rs): every deploy is a new
      # URL, old copies stay cached harmlessly. Applies to everything the
      # static folder serves, so a font file must change its name when its
      # content changes, and the 404 fallback page is cached for the URL
      # that missed until the real not-found handler replaces it.
      cache_control: "public, max-age=31536000, immutable"

# App settings, typed in src/settings.rs and parsed at boot: a missing or
# unknown key refuses to start.
settings:
  rate_limit:
    enable: true
    # 120 requests at once per visitor IP, then a sustained 60 per minute.
    # Only routes count, never static assets.
    per_second: 1
    burst: 120
  security:
    # Per-page CSP; {nonce} is replaced per request with the nonce Leptos
    # stamps on its inline scripts. 'wasm-unsafe-eval' is what the islands
    # bundle needs; nothing else is inline or third party.
    content_security_policy: >-
      default-src 'none';
      script-src 'self' 'nonce-{nonce}' 'wasm-unsafe-eval';
      style-src 'self';
      img-src 'self' data:;
      font-src 'self';
      manifest-src 'self';
      connect-src 'self';
      object-src 'none';
      base-uri 'self';
      form-action 'self';
      frame-ancestors 'none'
  # Nightly restart (src/maintenance.rs): once a day at `hour` o'clock in
  # `zone` (an IANA name; UTC as shipped, set your own) the server stops
  # itself and the service manager starts it again. `Restart=always` in the
  # unit (DEPLOYMENT.md) is what makes that a restart. A fresh process every day
  # is cheap insurance against whatever a long-running one accumulates.
  nightly_restart:
    enable: true
    hour: 3
    zone: UTC

# Worker Configuration
workers:
  # specifies the worker mode. Options:
  #   - BackgroundQueue - Workers operate asynchronously in the background, processing queued.
  #   - ForegroundBlocking - Workers operate in the foreground and block until tasks are completed.
  #   - BackgroundAsync - Workers operate asynchronously in the background, processing tasks with async capabilities.
  mode: BackgroundAsync

  

# Mailer Configuration.
mailer:
  # SMTP mailer configuration.
  smtp:
    # Enable/Disable smtp mailer.
    enable: true
    # SMTP server host. e.x localhost, smtp.gmail.com
    host: <%= get_env(name="MAILER_HOST") %>
    # SMTP server port
    port: <%= get_env(name="MAILER_PORT", default="587") %>
    # Use secure connection (SSL/TLS).
    secure: true
    auth:
      user: <%= get_env(name="MAILER_USER") %>
      password: <%= get_env(name="MAILER_PASSWORD") %>
    # Override the SMTP hello name (default is the machine's hostname)
    # hello_name:

# Initializers Configuration
# initializers:
#  oauth2:
#    authorization_code: # Authorization code grant type
#      - client_identifier: google # Identifier for the OAuth2 provider. Replace 'google' with your provider's name if different, must be unique within the oauth2 config.
#        ... other fields

# Database Configuration
database:
  # Database connection URI. Defaults to a SQLite file in the unit's working
  # directory (the deploy directory, DEPLOYMENT.md), created on first boot
  # by auto_migrate.
  uri: <%= get_env(name="DATABASE_URL", default="sqlite://app_production.sqlite?mode=rwc") %>
  # When enabled, the sql query will be logged.
  enable_logging: <%= get_env(name="DB_LOGGING", default="false") %>
  # Set the timeout duration when acquiring a connection.
  connect_timeout: <%= get_env(name="DB_CONNECT_TIMEOUT", default="500") %>
  # Set the idle duration before closing a connection.
  idle_timeout: <%= get_env(name="DB_IDLE_TIMEOUT", default="500") %>
  # Minimum number of connections for a pool.
  min_connections: <%= get_env(name="DB_MIN_CONNECTIONS", default="1") %>
  # Maximum number of connections for a pool. Serving real traffic on the
  # development default of 1 serializes every request behind one connection.
  max_connections: <%= get_env(name="DB_MAX_CONNECTIONS", default="10") %>
  # Run migration up when application loaded.
  # Convenient for single-instance deploys. Turn it off if you run more than
  # one instance or migrate as a separate release step, so instances do not
  # race to migrate the same database.
  auto_migrate: <%= get_env(name="DB_AUTO_MIGRATE", default="true") %>
  # Truncate database when application loaded. This is a dangerous operation, make sure that you using this flag only on dev environments or test mode
  dangerously_truncate: false
  # Recreating schema when application loaded.  This is a dangerous operation, make sure that you using this flag only on dev environments or test mode
  dangerously_recreate: false

# Authentication Configuration
auth:
  # JWT authentication
  jwt:
    # Secret key for token generation and verification. Required: a secret
    # committed to the repository is a secret your users can forge tokens with.
    secret: <%= get_env(name="JWT_SECRET") %>
    # Token expiration time in seconds
    expiration: 604800 # 7 days
