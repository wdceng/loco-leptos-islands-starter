# The same checks as a local pre-deploy pass, so a green run means what a
# local pass means. No database service: the app is SQLite-only and the
# tests create their own file.
name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Never `--all-features`: `ssr` and `hydrate` are mutually exclusive
      # halves of the same crate.
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  wasm:
    # The browser half alone, linted: fails if a server-only dependency
    # leaked out of the `ssr` feature gate, and lints the code that only
    # exists under `hydrate` (the islands), which the clippy job above
    # never compiles.
    name: Browser half (wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --lib --target wasm32-unknown-unknown --no-default-features --features hydrate -- -D warnings

  leptos:
    # Both halves plus Tailwind, as cargo-leptos builds them. cargo-leptos
    # comes prebuilt via cargo-binstall; it downloads the Tailwind and
    # wasm-bindgen binaries itself.
    name: cargo leptos build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Pinned to a release, not `@main`: an unreviewed change in that
      # repository must not run here. Bump deliberately.
      - uses: cargo-bins/cargo-binstall@v1.23.0
      # Pinned like the action, and to the version used locally: a new
      # cargo-leptos can change the Tailwind or wasm-bindgen it downloads
      # between two runs of the same commit. Bump it here and locally
      # together (`cargo install --locked cargo-leptos@<version>`).
      - run: cargo binstall -y cargo-leptos@0.3.8
      - run: cargo leptos build

  audit:
    # Known vulnerabilities in the dependency tree (RustSec database).
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Pinned to a release, not `@main`: an unreviewed change in that
      # repository must not run here. Bump deliberately.
      - uses: cargo-bins/cargo-binstall@v1.23.0
      # The tool is pinned; the advisory database it fetches is always the
      # latest.
      - run: cargo binstall -y cargo-audit@0.22.2
      - run: cargo audit
