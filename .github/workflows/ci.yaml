# The same checks as a local pre-deploy pass, so a green run means what a
# local pass means. No database service: the app is SQLite-only and the
# tests create their own file. `sqlx::query!` reads the committed `.sqlx/`
# cache (SQLX_OFFLINE), as the server build does; the sqlx job checks that cache is
# current.
name: CI
on:
  push:
    branches: [main]
  pull_request:
  # By hand: `gh workflow run CI --ref main`.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Never `--all-features`: `ssr` and `hydrate` are mutually exclusive
      # halves of the same crate.
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  wasm:
    # The browser half alone, linted: fails if a server-only dependency
    # leaked out of the `ssr` feature gate, and lints the code that only
    # exists under `hydrate` (the islands), which the clippy job above
    # never compiles.
    name: Browser half (wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --lib --target wasm32-unknown-unknown --no-default-features --features hydrate -- -D warnings

  leptos:
    # Both halves plus Tailwind, as cargo-leptos builds them, with `--split`
    # for the lazy islands. cargo-leptos is the patched build every machine
    # uses until both split fixes are released (tools/cargo-leptos/install.sh,
    # pinned to a commit and a patch in this repository), cached on the
    # script and the patch. It downloads the Tailwind and wasm-bindgen
    # binaries itself.
    name: cargo leptos build
    runs-on: ubuntu-latest
    env:
      CARGO_LEPTOS_SRC: /home/runner/cargo-leptos-split
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # Before rust-cache, which leaves alone what ~/.cargo/bin already holds.
      - id: cargo-leptos
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-leptos
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            /home/runner/cargo-leptos-split
          key: cargo-leptos-${{ runner.os }}-${{ hashFiles('tools/cargo-leptos/**') }}
      - if: steps.cargo-leptos.outputs.cache-hit != 'true'
        run: tools/cargo-leptos/install.sh
      - run: tools/cargo-leptos/check.sh
      - uses: Swatinem/rust-cache@v2
      - run: cargo leptos build --split
      # The deploy's frontend build, twice into a scratch folder: the same
      # code must give the same file names (wasm-split-prototype #79), and
      # the main script must name a split loader that exists
      # (cargo-leptos #690).
      - name: Hashed split build is stable
        run: |
          for run in 1 2; do
            LEPTOS_HASH_FILES=true LEPTOS_SITE_ROOT=target/site-check cargo leptos build --release --split --frontend-only
            ls target/site-check/pkg | sort > "names-$run.txt"
          done
          diff names-1.txt names-2.txt
          loader="$(grep -oh '__wasm_split\.[A-Za-z0-9_-]*\.js' target/site-check/pkg/app.*.js | head -1)"
          test -n "$loader" && test -f "target/site-check/pkg/$loader"

  browser:
    # The browser tests in Chrome (docs/testing.md): the island collector's
    # wasm tests, then e2e/run.sh, which builds the site with `--split` and
    # runs the moves in place and the memory tests against it. The runner
    # image ships Chrome with a matching chromedriver (CHROMEWEBDRIVER).
    # What a failed test's page showed is kept as an artifact.
    name: Browser tests (Chrome)
    runs-on: ubuntu-latest
    env:
      CARGO_LEPTOS_SRC: /home/runner/cargo-leptos-split
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # The same cache as the leptos job's.
      - id: cargo-leptos
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-leptos
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            /home/runner/cargo-leptos-split
          key: cargo-leptos-${{ runner.os }}-${{ hashFiles('tools/cargo-leptos/**') }}
      - if: steps.cargo-leptos.outputs.cache-hit != 'true'
        run: tools/cargo-leptos/install.sh
      - uses: Swatinem/rust-cache@v2
      - uses: cargo-bins/cargo-binstall@v1.23.0
      # The test runner of the exact wasm-bindgen release Cargo.lock holds.
      - run: cargo binstall -y wasm-bindgen-cli@0.2.129
      - name: Island collector
        run: CHROMEDRIVER="$CHROMEWEBDRIVER/chromedriver" cargo test --lib --target wasm32-unknown-unknown --no-default-features --features hydrate
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
      - name: Moves in place and memory
        run: CHROMEDRIVER="$CHROMEWEBDRIVER/chromedriver" bash e2e/run.sh
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-tests
          path: target/e2e/run/
          if-no-files-found: ignore

  sqlx:
    # The `.sqlx/` cache must match the queries and the migrated schema:
    # a migration or a changed `query!` without `cargo sqlx prepare` fails
    # here, not on the next server build.
    name: sqlx cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Same version and features as locally (docs/prerequisites.md).
      - run: cargo install --locked sqlx-cli@0.9.0 --no-default-features --features sqlite
      - run: cargo loco db migrate
        env:
          LOCO_ENV: test
      - run: cargo sqlx prepare --check -- --all-targets
        env:
          SQLX_OFFLINE: "false"
          DATABASE_URL: sqlite://app_test.sqlite

  audit:
    # Known vulnerabilities in the dependency tree (RustSec database).
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Pinned to a release, not `@main`: an unreviewed change in that
      # repository must not run here. Bump deliberately.
      - uses: cargo-bins/cargo-binstall@v1.23.0
      # The tool is pinned; the advisory database it fetches is always the
      # latest.
      - run: cargo binstall -y cargo-audit@0.22.2
      - run: cargo audit
