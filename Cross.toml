# cross-rs configuration for the Linux server build (docs/staging.md, docs/production.md).
#
# cross 0.2.5 defaults to an image tagged with its own version, which has no
# arm64 manifest, so on Apple Silicon the pull fails. The image here is the
# `main` build of 2026-10-09, pinned by digest so the toolchain that builds
# the production binary cannot change under a moving tag. Pull it once with
# the platform flag:
#   docker pull --platform linux/amd64 ghcr.io/cross-rs/x86_64-unknown-linux-gnu@sha256:c75170d35dd295c280755aaf58682fa7c0984f1e2512742eb2495b3b197338e3
# To move to a newer build, pull `:main` the same way and put the digest
# from `docker image inspect ghcr.io/cross-rs/x86_64-unknown-linux-gnu:main
# --format '{{index .RepoDigests 0}}'` here.
[target.x86_64-unknown-linux-gnu]
image = "ghcr.io/cross-rs/x86_64-unknown-linux-gnu@sha256:c75170d35dd295c280755aaf58682fa7c0984f1e2512742eb2495b3b197338e3"
